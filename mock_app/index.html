<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSight Test Store</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
    .card { background: rgba(125, 125, 125, 0.958); padding: 20px; border-radius: 8px; max-width: 300px; margin: 0 auto; }
    .product-img { width: 50%; height: 100px; background: #fffefe; border-radius: 4px; }
    
    /* DELIBERATE VISUAL BUG */
    .checkout-btn {
      position: absolute;
      left: -9999px; /* Pushes the button off-screen visually */
      background: #007bff;
      color: rgb(255, 255, 255);
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
    }
  </style>

<style>
/* Auto-applied by OmniSight Self-Healing Agent */
.checkout-btn { position: static; left: auto; display: block; width: 100%; margin-top: 15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="product-img"></div>
    <h2>Wireless Headphones with bluetooth 5.0
    </h2>
    <p>Price: $99.90</p>
    <!-- The button exists in DOM, but is visually hidden off-screen -->
    <button class="checkout-btn">Checkout Now</button>
  </div>
</body>
</html>
