<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSight Mock E-Commerce App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f4f9;
    }
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    /* Intentional UI Bug: Absolute positioning causing overflow and clipped text on mobile viewports */
    .cta-button {
      position: absolute;
      right: -50px;
      background-color: #007bff;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .price-tag {
      font-size: 20px;
      color: #28a745;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Smart Wireless Headphones</h2>
    <p>Noise-canceling over-ear headphones with 30-hour battery life and spatial audio support.</p>
    <div class="price-tag">$199.99</div>
    <!-- Button triggers visual overflow on 375px mobile viewport -->
    <button class="cta-button">Buy Now</button>
  </div>
</body>
</html>
